<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Ejemplo Bootstrap</title>
        <link rel="stylesheet" href="../../../../../bootstrap-5.1.3-dist/css/bootstrap.min.css">

    </head>
    <body>
        <form class="container" action="#" method="post">  
            <div class="row">
                <h1>Formulario de registro</h1>
            </div>
            <div class="row">
                <div class="col elemento">
                    <label class="form-label" for="nombre">Nombre:</label><br>
                    <input class="form-control" type="text" name="nombre" id="nombre" placeholder="Escribe tu nombre">
                    <br>
                    <label class="form-label" for="email">E-mail:</label><br>
                    <input class="form-control" type="email" name="email" id="email" placeholder="Escribe tu e-mail">
                    <label class="form-label" for="password">Password:</label><br>
                    <input class="form-control" type="password" name="password" id="password" placeholder="Al menos 8 caracteres entre letras y dígitos">
                </div>

                <div class="col elemento" >
                    <label class="form-label" for="provincia">Provincia:</label><br>
                    <select class="form-control" name="provincia" id="provincia">
                        <option value="Alicante">Alicante</option>
                        <option value="Valencia">Valencia</option>
                        <option value="Castellón">Castellón</option>
                    </select>
                    <input type="checkbox" name="suscripcion" id="suscripcion">
                    <label class="form-label" for="suscripcion">Deseo suscribirme al boletín de noticias</label>
                    <input class="btn btn-primary" type="submit" value="Enviar">
                </div>
            </div>
        </form>
    </body>
</html>
