<!DOCTYPE html>

<html>
<head>
<style>
a.uno:link {color:#FF0000;}    /* unvisited link */
a.uno:visited {color:#00FF00;} /* visited link */
a.uno:hover {color:#FF00FF;}   /* mouse over link */
a.uno:active {color:#0000FF;}  /* selected link */

a.dos:link {text-decoration:none;}    /* unvisited link */
a.dos:visited {text-decoration:none;} /* visited link */
a.dos:hover {text-decoration:underline;}   /* mouse over link */
a.dos:active {text-decoration:underline;}  /* selected link */

a.tres:link {background-color:#B2FF99;}    /* unvisited link */
a.tres:visited {background-color:#FFFF85;} /* visited link */
a.tres:hover {background-color:#FF704D;}   /* mouse over link */
a.tres:active {background-color:#FF704D;}  /* selected link */
</style>
</head>

<body>
<p><b><a class="uno" href="../../tema3_css.html" target="_self">This is a link</a></b></p>
<p><b><a class="dos" href="../../tema3_css.html" target="_self">This is a link</a></b></p>
<p><b><a class="tres" href="../../tema3_css.html" target="_self">This is a link</a></b></p>

<p><b>Note:</b> a:hover MUST come after a:link and a:visited in the CSS 
definition in order to be effective.</p>
<p><b>Note:</b> a:active MUST come after a:hover in the CSS definition in order 
to be effective.</p>
</body>
</html>
