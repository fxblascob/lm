<pre>
&lt;!DOCTYPE html&gt;
&lt;html&gt;
&lt;head&gt;
&lt;style&gt;
img
{
position:absolute;
left:0px;
top:0px;
z-index:-1;
}
&lt;/style&gt;
&lt;/head&gt;

&lt;body&gt;
&lt;h1&gt;This is a heading&lt;/h1&gt;
&lt;img src="w3css.gif" width="100" height="140" /&gt;
&lt;p&gt;Because the image has a z-index of -1, it will be placed behind the text.&lt;/p&gt;
&lt;/body&gt;
&lt;/html&gt;
</pre>
