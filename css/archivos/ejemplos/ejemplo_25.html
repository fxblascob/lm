<!DOCTYPE html>
<html>
<head>
<style>
p.normal_1 {font-style:normal;}
p.italic {font-style:italic;}
p.oblique {font-style:oblique;}

p.normal {font-weight:normal;}
p.light {font-weight:lighter;}
p.thick {font-weight:bold;}
p.thicker {font-weight:900;}
</style>
</head>

<body>
<p class="normal_1">This is a paragraph, normal.</p>
<p class="italic">This is a paragraph, italic.</p>
<p class="oblique">This is a paragraph, oblique.</p>

<p class="normal">This is a paragraph normal weight.</p>
<p class="light">This is a paragraph light weight.</p>
<p class="thick">This is a paragraph bold weight.</p>
<p class="thicker">This is a paragraph 900 weight.</p>

</body>

</html>
