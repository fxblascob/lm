<!DOCTYPE html>
<html>
<head>
<style>
table, td, th
{
border:1px solid orange;
}

table#dos
{
border-collapse:collapse;
}
table#uno{float:left;margin-right:2em;}
</style>
</head>

<body>
<table id="uno">
<caption>Sin collapse</caption>
<tr> 
<th>Firstname</th>
<th>Lastname</th>
</tr>
<tr>
<td>Peter</td>
<td>Griffin</td>
</tr>
<tr>
<td>Lois</td>
<td>Griffin</td>
</tr>
</table>

<table id="dos">
<caption>Usando collapse</caption>
<tr> 
<th>Firstname</th>
<th>Lastname</th>
</tr>
<tr>
<td>Peter</td>
<td>Griffin</td>
</tr>
<tr>
<td>Lois</td>
<td>Griffin</td>
</tr>
</table>
</body>
</html>
