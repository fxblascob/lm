<!DOCTYPE html>
<html>
<head>
<style>
table, td, th
{
border:1px solid black;
}
td
{
height:50px;
}
tr.uno {vertical-align:top;}
tr.dos {vertical-align:middle;}
tr.tres {vertical-align:bottom;}

</style>
</head>

<body>
<table>
<tr>
<th>Firstname</th>
<th>Lastname</th>
<th>Savings</th>
</tr>
<tr class="uno">
<td>Peter</td>
<td>Griffin</td>
<td>$100</td>
</tr>
<tr class="dos">
<td>Lois</td>
<td>Griffin</td>
<td>$150</td>
</tr>
<tr class="tres">
<td>Joe</td>
<td>Swanson</td>
<td>$300</td>
</tr>
</table>
</body>
</html>
