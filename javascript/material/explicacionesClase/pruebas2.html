<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Ejercicio 1 </title>
        <script type= "text/javascript">
             let num;
            do {
                num=prompt("Introduce un numero del 1 al 10: ");
                num=parseInt(num);
                if (num < 1 ||  num >10) 
                    alert("Introduce un número entre 1 y 10");
                   
            } while (num < 1 ||  num >10);    

            document.write("<ul>");
            for (let x = 1; x <= 10; x++)
            {
                document.write("<li>" + num + " x " + x + " = " +(num * x)+ "</li>");
            }
            document.write("</ul>");    
        </script>
