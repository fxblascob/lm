<SCRIPT LANGUAGE=JavaScript>
<!-- esconder codigo
function Dime()  {
   var Hoy = new Date();
   var laHora = Hoy.getHours();
   var Diferencia = (Hoy.getTimezoneOffset() / 60);
   laHora -= Diferencia;
   if (laHora > 23)  {laHora -= 24};
   document.write(laHora + " horas y " + Hoy.getMinutes() + " minutos.");
   window.setTimeout("Dime();", 60000);
}
// Fin esconder -->
</SCRIPT>

</HEAD>

<BODY TEXT=navy BGCOLOR=white>
