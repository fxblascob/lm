<HTML>
<HEAD>
<TITLE>Manual practico de JavaScript - Js24</TITLE>
<LINK REL=stylesheet HREF=hoja.css TYPE=text/css>
</HEAD>
<BODY>
<H1>Calandario</H1>
<SCRIPT LANGUAGE=JavaScript>
function greeting(){
   var today = new Date();
   var hrs = today.getHours();
   document.writeln("<CENTER>");
   document.write("<H3>Buenas ");
   if (hrs < 12)
      document.write("Dias");
   else if (hrs <= 18)
      document.write("Tardes");
   else
      document.write("Noches");
   document.writeln("!</H3>");
   document.write("Tu entraste a esta pagina el ");
   dayStr = today.toLocaleString();
   document.write(dayStr);
   document.writeln("</CENTER>");
}

function montharr(m0, m1, m2, m3, m4, m5, m6, m7, m8, m9, m10, m11){
   this[0] = m0;
   this[1] = m1;
   this[2] = m2;
   this[3] = m3;
   this[4] = m4;
   this[5] = m5;
   this[6] = m6;
   this[7] = m7;
   this[8] = m8;
   this[9] = m9;
   this[10] = m10;
   this[11] = m11;
}

function calendar(){
   var monthNames = "EneFebMarAbrMayJunJulAgoSepOctNovDic";
   var today = new Date();
   var thisDay;
   var monthDays = new montharr(31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31);
   year = today.getYear();
   thisDay = today.getDate();
   
   if (((year % 4 == 0) && (year % 100 != 0)) || (year % 400 == 0))
      monthDays[1] = 29;
   nDays = monthDays[today.getMonth()];
   firstDay = today;
   firstDay.setDate(1);
   testMe = firstDay.getDate();
   if (testMe == 2)
        firstDay.setDate(0);    
   startDay = firstDay.getDay();
     
   document.writeln("<CENTER>");
   document.write("<TABLE BGCOLOR=#FFFFAA BORDER=1>");
   document.write("<TR><TH COLSPAN=7><FONT COLOR=maroon>");
   document.write(monthNames.substring(today.getMonth()*3,(today.getMonth()+1) * 3));
   document.write(".  ");
   document.write(year);
   document.write("</FONT><TR><TH>Dom<TH>Lun<TH>Mar<TH>Mie<TH>Jue<TH>Vie<TH>Sab");
   document.write("<TR ALIGN=center>");
   column = 0;
   for (i=0; i<startDay; i++) {document.write("<TD>"); column++; }
   for (i=1; i<=nDays; i++) {
      if (i == thisDay) {document.write("<TD BGCOLOR=red><FONT COLOR=white><B>"+i+"</B></FONT>");}
      else if (column == 0) {document.write("<TD><FONT COLOR=red><B>"+i+"</B></FONT>");}
      else {document.write("<TD><B>"+i+"</B>");}
      column++;
      if (column == 7) {document.write("<TR ALIGN=center>"); column = 0;}
   }
   document.write("</TABLE></CENTER>");
}
greeting();
document.write("<BR>");
calendar();
document.write("");
</SCRIPT>
</BODY>
</HTML>
