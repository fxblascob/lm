<H1>Enlace que cambia color</H1>
Pasa el puntero del ratón por encima de los asteriscos para que cambie 
el color del fondo.<P>

<A HREF="" OnMouseOver="document.bgColor='silver'">*</A>
<A HREF="" OnMouseOver="document.bgColor='lightslategray'">*</A>
<A HREF="" OnMouseOver="document.bgColor='azure'">*</A>
<A HREF="" OnMouseOver="document.bgColor='lightgreen'">*</A>
<A HREF="" OnMouseOver="document.bgColor='lightblue'">*</A>
<A HREF="" OnMouseOver="document.bgColor='white'">*</A>
