<H1>Dias que aun faltan para el 2,003</H1>
<SCRIPT LANGUAGE=JavaScript>
var urodz = new Date("January 1, 2003");
var now = new Date();
var ile = urodz.getTime() - now.getTime();
var dni = Math.floor(ile / (1000 * 60 * 60 * 24));
if (dni > 1) document.write("Solo faltan "+dni+" dias para el año 2,003")
else if (dni == 1) document.write("Solo dos dias para el año 2,003")
else if (dni == 0) document.write("Mañana es el año 2,003")
else document.write("1º de enero del 2,003");
</SCRIPT>
