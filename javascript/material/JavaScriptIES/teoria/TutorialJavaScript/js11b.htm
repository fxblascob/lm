<HTML>
<HEAD>
<TITLE>Manual practico de JavaScript - Js11b</TITLE>
<SCRIPT LANGUAGE=JavaScript>
<!-- esconder codigo
var RelojID12 = null
var RelojEjecutandose12 = false

function DetenerReloj12 (){
   if (RelojEjecutandose12)
     clearTimeout(RelojID12)
   RelojEjecutandose12 = false
}

function MostrarHora12 () {
   var ahora = new Date()
   var horas = ahora.getHours()
   var minutos = ahora.getMinutes()
   var segundos = ahora.getSeconds()
   var meridiano

   //ajusta las horas
   if (horas > 12) {
      horas -= 12
      meridiano = " P.M."
   } else
      meridiano = " A.M."  

   //establece las horas
   if (horas < 10)
      ValorHora = "0" + horas
   else
      ValorHora = "" + horas

   //establece los minutos
   if (minutos < 10)
      ValorHora += ":0" + minutos
   else
      ValorHora += ":" + minutos

   //establece los segundos
   if (segundos < 10)
      ValorHora += ":0" + segundos
   else
      ValorHora += ":" + segundos       

   ValorHora += meridiano

   //aqui seleccionas donde se muestra
   //en el TextBox
   document.reloj12.digitos.value=ValorHora
   //en la barra de estado
   //window.status = ValorHora

   RelojID12 = setTimeout("MostrarHora12()",1000)
   RelojEjecutandose12=true
}

function IniciarReloj12 () {
   DetenerReloj12()
   MostrarHora12()
}
// fin esconder -->
</SCRIPT>
<LINK REL=stylesheet HREF=hoja.css TYPE=text/css>
</HEAD>

<BODY onLoad="IniciarReloj12()">
<H1>Reloj digital de 12 horas</H1>
<CENTER>
<FORM NAME=reloj12>
   <INPUT TYPE=text SIZE=12 NAME=digitos VALUE=" " STYLE="Font-Size: 36;Font-Weight: Bold;color: blue;Background: #EEEEFF;Text-align: center">
</FORM>
<P>
