<SCRIPT LANGUAGE=JavaScript>
<!-- esconder codigo
function RandomNumber(max){  
   var today = new Date();
   var num= Math.round((Math.abs(Math.sin(today.getTime()))*1000))%max+1;
   return num;
}
// fin esconder -->
</SCRIPT>
