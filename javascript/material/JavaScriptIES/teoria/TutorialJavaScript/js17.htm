<HTML> 
<HEAD> 
<TITLE>Manual practico de JavaScript - Js17</TITLE> 
<SCRIPT LANGUAGE=JavaScript> 
function Saltar(pal) {window.location=pal+".htm"} 
</SCRIPT> 
<LINK REL=stylesheet HREF=hoja.css TYPE=text/css>
</HEAD>
<BODY>
<DIV ALIGN=justify>
<H1>Acceso a una pagina con clave</H1> 

<FORM> 
Introduce la palabra clave para acceder a la página<P> 
<INPUT TYPE=password NAME=clave SIZE=25 VALUE=""> 
<INPUT TYPE=button VALUE=Acceder onClick="Saltar(this.form.clave.value)"> 
</FORM> 

<B>NOTA:</B> Una vez escogida la clave (por ejemplo: xyz123), debemos dar a la página 
de acceso restringido precisamente este nombre: <B>xyz123.htm</B><P>

No hay que cambiar ni añadir nada en este script.

</BODY> 
</HTML>
