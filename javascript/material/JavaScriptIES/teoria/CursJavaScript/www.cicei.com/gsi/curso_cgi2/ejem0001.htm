<h2>&lt INPUT NAME="..." TYPE="text" &gt </h2>

<form> 

      <table>
             <td> <h2> <b> Introduzca texto </b> </h2> </td> 
             <td> <input name="nombre" type="text" >   </td>
      </table>

</form>
<blockquote>
             NOTA:
             <ul>
                 <li>Si se omite el atributo <i>type</i> el resultado es equivalente.
                 <li>Se puede escoger un texto de longitud superior a la casilla (<i>scrolling</i> horizontal)
             </ul>
</blockquote>
