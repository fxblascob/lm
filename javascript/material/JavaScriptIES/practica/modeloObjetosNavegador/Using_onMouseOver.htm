<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">
<html><head><title>Using "onMouseOver"</title>


<meta http-equiv="Content-Type" content="text/html; charset=windows-1252">
<script language="JavaScript">
<!-- Beginning of JavaScript -

function changecolor(code) { 
	document.bgColor=code }

// - End of JavaScript - -->
</script>

<meta content="Microsoft FrontPage 4.0" name="GENERATOR"></head><body bgcolor="#ffffff">
<center>
<h1>Evento "onMouseOver"</h1></center>
<hr>

<p>Uso del evento "onMouseOver" para cambiar el color de fondo moviendo el ratón sobre la imagen</p>

<a onmouseover="changecolor('ffffff')" href="http://www./">
<img src="Using_onMouseOver_files/white.gif" height="20" hspace="10" vspace="10" width="20">
</a>
 
<a onmouseover="changecolor('ff0000')" href="http://www./">
<img src="Using_onMouseOver_files/red.gif" height="20" hspace="10" vspace="10" width="20">
</a>

<a onmouseover="changecolor('ffff00')" href="http://www./">
<img src="Using_onMouseOver_files/yellow.gif" height="20" hspace="10" vspace="10" width="20">
</a>

<a onmouseover="changecolor('009900')" href="http://www./">
<img src="Using_onMouseOver_files/green.gif" height="20" hspace="10" vspace="10" width="20">
</a>

<a onmouseover="changecolor('0000ff')" href="http://www./">
<img src="Using_onMouseOver_files/blue.gif" height="20" hspace="10" vspace="10" width="20">
</a> 

<hr>
</body></html>
