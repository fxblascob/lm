</script></head><body>
<h3>Conversión de pesetas y euros</h3>

<form name="monedas">
Pesetas: <input name="pesetas" type="text">
<input value="Convertir a euros" onclick="if(!isNaN(this.form.pesetas.value)) this.form.c_euros.value=this.form.pesetas.value/166.386; else alert('No es un numero');" type="button">
Euros: <input name="c_euros" readonly="readonly" type="text">
<hr>
Euros: <input name="euros" type="text">
<input value="Convertir a pesetas" onclick="if(!isNaN(this.form.euros.value)) this.form.c_pesetas.value=this.form.euros.value*166.386; else alert('No es un numero');" type="button">
Pesetas: <input name="c_pesetas" readonly="readonly" type="text">
</form>

</body></html>
