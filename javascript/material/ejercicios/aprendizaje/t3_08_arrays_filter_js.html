<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Ejercicio 3.9 </title>
        <script type="text/javascript"> 
        /*
        Crea una página llamada 08_arrays_filter_js.html. Crea una función que reciba un array y devuelva
        otro solo con sus elementos paresy lo muestre.
        Puedes utilizar filter
         */
            window.onload = function() {
                'use strict';
               
                let array = [3,2,6,5,8,4];
                
                let mostrar = document.getElementById("mostrar")

                mostrar.innerHTML +="<br> Los elementos del array: "+ array;
                
                let arrayFiltrado = array.filter(x => x % 2 == 0);

                mostrar.innerHTML +="<br> Los elementos pares del array: "+arrayFiltrado;
            }
        </script>
    </head>
    <body>
        <div id="mostrar" style="border: 4px solid red"></div>
    </body>
</html>
