<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Ejercicio 3.12 </title>
        <script type="text/javascript"> 
            'use strict';
            window.onload = function() {
                /*
                Crea un fichero llamado 03_funciones_arrays_js.html. Define una función que reciba
                un array y un número como parámetros y devuelva si todos los números del array
                son múltiplos del número recibido como parámetro. Haz que el número tome por
                defecto el valor de 2, y prueba la función con distintas llamadas, puedes utilizar every()
                */

                function multiplos(array, num=2){
                    return array.every(item => item % num==0);
                }

                let array = prompt("introducce numeros separados por espacio","2 4 6 8").split(" ");
                let num = prompt("Introduce un número para ver si los elementos del array son múltiplos")
                // muestro el array
                document.getElementById("mostrar").innerHTML +="<br> Array: "+ array+"<br>";

                document.getElementById("mostrar").innerHTML +="<br> los números del array son multiplos de "+num+" "+  multiplos(array,num);

            }
        </script>
    </head>
    <body>
        <div id="mostrar" style="border: 4px solid red"></div>
    </body>
</html>
