<!DOCTYPE html>
<html lang = "es">
    <head>
        <meta charset="UTF-8">
        <script>
            'use strict';
            let suma = 0;
            //-----------suma con for
            for(let i = 1; i<= 5; i++)
                suma += i;
            alert("suma con for:"+suma);
            //-----------suma con while
            let i = 1;
            suma = 0;
            while (i<=5){
                suma += i;
                i++;
            }
            alert("suma con while:"+suma);
            //-----------suma con do while
            i = 1;
            suma = 0;
            do {
                suma += i;
                i++;
            }while (i<=5);
            alert("suma con do while:"+suma);
        </script>
    </head>
    <body>

    </body>
</html>
