<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Ejercicio 1 - Archivo externo y varios mensajes</title>
        
    </head>
    <body>
        <noscript>
                Esta página <strong>requiere</strong> el uso de JavaScript y parece que está desactivado
        </noscript>
        <script>
            let numero1 = parseFloat(prompt("Introduce el primer número"));
            let numero2 = parseFloat(prompt("Introduce el segundo número"));
            
            alert("Suma: " + (numero1+numero2) );
            alert("Resta: " + (numero1-numero2) );
            alert("Multiplicación: " + (numero1*numero2) );
            alert("División: " + (numero1/numero2) );
        </script>
    </body>
</html>
