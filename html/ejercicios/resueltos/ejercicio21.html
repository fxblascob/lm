<!DOCTYPE html>
<html lang="es">
    <head>
        <title>ejercicio 21</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <form action="manejador.html" enctype="multipart/form-data"   method="post">
            Nombre:
                <input type="text" name="usuario" value="user"> <br>
            Curso:
                <select name="curso">
                    <option value="1ESO">1º ESO</option>
                    <option value="2ESI" selected>2º ESI</option>
                    <option value="1ASI">1º ASI</option>
                    <option value="2ASI">2º ASI</option>
                </select> 
            
                <input type="radio" name="grupo" value="a"> A
                <input type="radio" name="grupo" value="b"> B <br>
            Actividades extraescolares:<br>
                <input type="radio" name="futbol" value="fu"> Fútbol 
                <input type="radio" name="Baloncesto" value="ba"> Baloncesto 
                <input type="radio" name="natación" value="na"> Natación 
                <input type="radio" name="judo" value="ju"> Judo 
                <input type="radio" name="inglés" value="in"> Inglés <br>
            Opinión:<br>
                <textarea name="opinion" rows="5" cols="50" ></Textarea><br>
            
            <input type="submit" value="Enviar">
            <input type="reset" value="Borrar datos">
        </form>
	</body>
</html>
