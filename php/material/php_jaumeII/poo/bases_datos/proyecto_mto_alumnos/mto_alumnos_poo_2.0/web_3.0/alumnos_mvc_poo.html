<!doctype = html>
<html>
	<head>
		<LINK href="alumnos_mvc_poo.css" rel="stylesheet" type="text/css">
	</head>
	<body>
		<div id="contenedor_general">
			<header id = "contenedor_titulo">
				<h1>Mantenimiento de alumnos v3.0 <h1>
			</header>
			<div id = "contenedor_cuerpo">
			
				<form name="form1" method="post" action="{form_action}">		
					<figure id="contenedor_foto">
						<img src="{form_foto}" border="0" width="70" height="70">
					</figure>
					<div id="contenedor_datos">	
						ID:<input type = 'text' name= 'id' size='4' value='{form_id}'>
						Nombre:<input type = 'text' name= 'nombre' size='10' value='{form_nombre}'>
						Apellidos:<input type = 'text' name= 'apellidos'  size='15'  value='{form_apellidos}'><br>
						Curso:<input type = 'text' name= 'curso' size='6'  value='{form_curso}'>
						Grupo:<input type = 'text' name= 'grupo' size='2'  value='{form_grupo}'>
						Anyo:<input type = 'text' name= 'anyo' size='9'  value='{form_anyo}'><br>
						Num Ord:<input type = 'text' name= 'numord' size='2'  value='{form_numord}'>	
						Aula:<input type = 'text' name= 'aula' size='2'  value='{form_aula}'>
						Foto:<input type = 'file' name= 'fichero_caratula'   accept='image/*'  >	
					</div>
					<div id="contenedor_sql">
						<textarea name="cadena_sql" rows=3 cols=30 >{form_sql}</textarea>
					</div>
					<nav id="contenedor_menu">
						<input class="boton" type="submit" name="primero" value="<<">
						<input class="boton" type="submit" name="anterior" value=" < ">
						<input class="boton" type="submit" name="siguiente" value=" > ">
						<input class="boton" type="submit" name="ultimo" value=">>">
						<input class="boton" type="submit" name="insertar" value="Ins">
						<input class="boton" type="submit" name="modificar" value="edit">
						<input class="boton" type="submit" name="borrar" value="delete">
						<input class="boton" type="submit" name="limpiar" value="clear">
						<input class="boton" type="submit" name="buscar" value="buscar">
						<input class="boton" type="submit" name="enviar" value="enviar">
					</nav>
					
				</form>
			<div>
			<footer id="contenedor_pie">
			</footer>
		</div>
	</body>
</html>
